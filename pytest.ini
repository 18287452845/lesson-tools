[pytest]
# Pytest configuration for Lesson Plan Tool testing

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test* *
python_functions = test_*

# Test paths
testpaths = backend/tests

# Asyncio mode for async tests
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=backend
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=60
    -p no:warnings

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use external services)
    slow: Slow tests (database, file I/O, AI calls)
    api: API endpoint tests
    service: Service layer tests
    database: Database operation tests
    ai: Tests that call AI providers (require API keys)
    smoke: Quick smoke tests to verify basic functionality

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
timeout = 300

# Minimum version
minversion = 7.0
