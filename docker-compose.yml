services:
  # Backend service - FastAPI
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lesson-tools-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      # AI Provider Configuration
      - AI_PROVIDER=${AI_PROVIDER:-deepseek}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # Optional API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - AI_MODEL=${AI_MODEL:-deepseek-v4-flash}
      # 0 omits max_tokens from AI requests (provider/model limit applies).
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-0}
      - AI_MAX_TOKENS_BATCH=${AI_MAX_TOKENS_BATCH:-0}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.7}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}

      # External textbook discovery
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      - BOOK_SEARCH_TIMEOUT=${BOOK_SEARCH_TIMEOUT:-15.0}
      - BOOK_SEARCH_MAX_RESULTS=${BOOK_SEARCH_MAX_RESULTS:-8}
      - BOOK_SEARCH_USER_AGENT=${BOOK_SEARCH_USER_AGENT:-YunlinLessonTools/1.1 (educational textbook discovery)}

      # Database
      - DATABASE_URL=sqlite:///storage/database.db
    volumes:
      # Persist database and storage
      - ./storage:/app/storage
      # Mount code for development (comment out for production)
      # - ./backend:/app/backend
    networks:
      - lesson-tools-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend service - React + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lesson-tools-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - lesson-tools-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  lesson-tools-network:
    driver: bridge

volumes:
  storage:
    driver: local
